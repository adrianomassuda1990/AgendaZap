<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia Yukio - Painel Administrativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 sm:p-8 flex justify-center items-start">

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="w-full max-w-sm bg-zinc-900 p-6 rounded-2xl border border-zinc-800 shadow-2xl space-y-4 mt-12">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mx-auto border border-amber-500/20">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h2 class="text-lg font-bold text-zinc-100">Acesso Restrito</h2>
      <p class="text-xs text-zinc-400">Insira a senha do painel</p>
    </div>
    <input type="password" id="input-senha" placeholder="Digite a senha..." class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:ring-2 focus:ring-amber-500 focus:outline-none text-center">
    <button onclick="verificarSenha()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold text-sm rounded-xl transition-all shadow-lg shadow-amber-500/20">
      Entrar no Painel
    </button>
  </div>

  <!-- CONTEÚDO DO PAINEL -->
  <div id="admin-content" class="w-full max-w-4xl space-y-6 hidden">
    
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-zinc-900 p-6 rounded-2xl border border-zinc-800 shadow-xl">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-bold text-zinc-100 uppercase tracking-tight">Barbearia Yukio</h1>
          <span class="bg-amber-500/10 text-amber-500 border border-amber-500/30 text-xs px-2.5 py-1 rounded-full font-bold">Painel de Gestão</span>
        </div>
        <p class="text-xs text-zinc-400 mt-1">Configuração de canais, horários e pausas</p>
      </div>
      <button onclick="sair()" class="text-xs text-zinc-400 hover:text-red-400 flex items-center gap-1 transition-all">
        <i data-lucide="log-out" class="w-4 h-4"></i> Sair
      </button>
    </div>

    <!-- 1. CANAIS DISPONÍVEIS -->
    <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 space-y-4">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h2 class="text-base font-bold text-zinc-200 flex items-center gap-2">
          <i data-lucide="share-2" class="w-5 h-5 text-amber-500"></i> Canais Ativos para Receber Agendamentos
        </h2>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-2">
          <label class="block text-xs font-bold uppercase text-zinc-400">WhatsApp (Número)</label>
          <input type="tel" id="input-whats-yukio" placeholder="Ex: 09012345678" class="w-full p-2.5 bg-zinc-900 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none">
        </div>
        <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-2">
          <label class="block text-xs font-bold uppercase text-zinc-400">Instagram (@)</label>
          <input type="text" id="input-instagram-yukio" placeholder="Ex: barbeariayukio" class="w-full p-2.5 bg-zinc-900 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none">
        </div>
        <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-2">
          <label class="block text-xs font-bold uppercase text-zinc-400">Telegram (@)</label>
          <input type="text" id="input-telegram-yukio" placeholder="Ex: barbeariayukio" class="w-full p-2.5 bg-zinc-900 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none">
        </div>
      </div>
      <button onclick="salvarConfiguracoesServidor('Canais atualizados com sucesso!')" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold text-sm rounded-xl transition-all shadow-lg shadow-amber-500/20">
        Guardar Canais
      </button>
    </div>

    <!-- 2. ALTERAR SENHA -->
    <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 space-y-4">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h2 class="text-base font-bold text-zinc-200 flex items-center gap-2">
          <i data-lucide="key" class="w-5 h-5 text-amber-500"></i> Segurança do Painel
        </h2>
      </div>
      <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 flex gap-2">
        <input type="password" id="input-nova-senha" placeholder="Nova senha do painel..." class="flex-1 p-2.5 bg-zinc-900 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none">
        <button onclick="salvarConfiguracoesServidor('Senha atualizada com sucesso!')" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold text-xs rounded-lg transition-all">
          Atualizar Senha
        </button>
      </div>
    </div>

    <!-- 3. GERENCIAR SERVIÇOS -->
    <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 space-y-4">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h2 class="text-base font-bold text-zinc-200 flex items-center gap-2">
          <i data-lucide="scissors" class="w-5 h-5 text-amber-500"></i> Serviços & Valores (Yen ¥)
        </h2>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 bg-zinc-950 p-3 rounded-xl border border-zinc-800">
        <input type="text" id="novo-servico-nome" placeholder="Nome do Serviço" class="p-2.5 bg-zinc-900 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none">
        <input type="number" id="novo-servico-preco" placeholder="Valor (¥)" class="p-
