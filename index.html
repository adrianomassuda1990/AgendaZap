<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Barbearia - Agendamento Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 min-h-screen flex justify-center p-0 sm:p-4 text-zinc-100">

  <div class="w-full max-w-md bg-zinc-900 min-h-screen sm:min-h-[750px] sm:rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden relative border border-zinc-800">
    
    <div>
      <!-- Header Dinâmico (Nome e Logo) -->
      <div class="bg-gradient-to-b from-zinc-800 to-zinc-900 text-white p-6 text-center relative border-b border-zinc-800">
        <div id="logo-container" class="w-20 h-20 rounded-full border-2 border-amber-500/50 shadow-lg mx-auto overflow-hidden bg-zinc-950 flex items-center justify-center mb-2">
          <i data-lucide="scissors" class="w-10 h-10 text-amber-500" id="default-icon"></i>
        </div>
        <h1 id="barber-name" class="text-xl font-bold tracking-tight uppercase">Barbearia</h1>
        <p class="text-xs text-amber-500/90 flex items-center justify-center gap-1 mt-1 font-medium">
          <i data-lucide="map-pin" class="w-3 h-3"></i> Gunma - Ota, Japão
        </p>
      </div>

      <!-- Indicador de Passos -->
      <div id="steps-indicator-wrapper" class="flex border-b border-zinc-800 bg-zinc-950/50 px-4 py-3 text-xs font-medium text-zinc-400 justify-between">
        <button type="button" onclick="irParaPasso(1)" id="step-1-indicator" class="text-amber-500 font-bold flex items-center gap-1 hover:text-amber-400 transition-all">1. Serviço</button>
        <span>&gt;</span>
        <button type="button" onclick="irParaPasso(2)" id="step-2-indicator" class="flex items-center gap-1 hover:text-amber-400 transition-all">2. Data e Horário</button>
        <span>&gt;</span>
        <button type="button" onclick="irParaPasso(3)" id="step-3-indicator" class="flex items-center gap-1 hover:text-amber-400 transition-all">3. Confirmação</button>
      </div>

      <!-- PASSO 1 -->
      <div id="step-1" class="p-5 space-y-5">
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-2">Selecione o Serviço</label>
          <div class="space-y-2" id="container-servicos-cliente">
            <p class="text-xs text-zinc-500">A carregar serviços...</p>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-2">Profissional</label>
          <div class="p-3 border border-amber-500/40 bg-amber-500/5 rounded-xl flex items-center gap-3">
            <div class="w-10 h-10 bg-amber-500 text-zinc-950 rounded-full flex items-center justify-center font-bold text-sm">DY</div>
            <div>
              <div class="text-sm font-bold text-zinc-100">Danilo Yukio</div>
              <div class="text-xs text-amber-500">Barbeiro responsável</div>
            </div>
          </div>
        </div>
      </div>

      <!-- PASSO 2 -->
      <div id="step-2" class="p-5 space-y-5 hidden">
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-2">Selecione a Data</label>
          <input type="date" id="data-agendamento" onchange="carregarHorariosCliente()" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-amber-500 font-bold focus:ring-2 focus:ring-amber-500 focus:outline-none">
        </div>

        <div id="alerta-dia-fechado" class="hidden p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-center space-y-1">
          <p class="text-sm font-bold text-red-400">Barbearia Fechada nesta Data!</p>
          <p class="text-xs text-zinc-400">Por favor, escolha outro dia no calendário acima.</p>
        </div>

        <div id="wrapper-horarios">
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-2">Horários Disponíveis</label>
          <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-60 overflow-y-auto pr-1" id="horarios-grid-cliente"></div>
        </div>
      </div>

      <!-- PASSO 3 -->
      <div id="step-3" class="p-5 space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Seu Nome Completo</label>
          <input type="text" id="nome-cliente" placeholder="Ex: Carlos Silva" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:ring-2 focus:ring-amber-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Contato (WhatsApp / Opcional)</label>
          <input type="text" id="whats-cliente" placeholder="Ex: 090-XXXX-XXXX ou Apelido" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:ring-2 focus:ring-amber-500 focus:outline-none">
        </div>
      </div>

      <!-- PASSO 4 -->
      <div id="step-4" class="p-6 text-center space-y-4 hidden my-auto">
        <div class="w-16 h-16 bg-amber-500/20 text-amber-500 rounded-full flex items-center justify-center mx-auto border border-amber-500/40 shadow-xl">
          <i data-lucide="check-circle-2" class="w-10 h-10"></i>
        </div>
        <div class="space-y-1">
          <h2 class="text-xl font-bold text-zinc-100">Agendamento Registado!</h2>
          <p class="text-xs text-zinc-400 px-2" id="instrucao-envio">Escolha por onde deseja enviar a confirmação:</p>
        </div>

        <div id="container-botoes-canais" class="space-y-2 pt-2"></div>

        <button onclick="location.reload()" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold text-xs rounded-xl transition-all mt-3">
          Fazer Novo Agendamento
        </button>
      </div>
    </div>

    <!-- Rodapé -->
    <div id="footer-actions" class="p-4 bg-zinc-900 border-t border-zinc-800 flex flex-col gap-3">
      <button id="next-btn" onclick="nextStep()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold text-sm rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2">
        <span>Avançar para Horários</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>

      <div class="text-center pt-1" id="footer-link-admin">
        <a href="painel.html" class="text-[11px] text-zinc-500 hover:text-amber-500 flex items-center justify-center gap-1 transition-all">
          <i data-lucide="lock" class="w-3 h-3"></i> Área Restrita / Painel do Barbeiro
        </a>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://agendazap-ozrf.onrender.com";
    lucide.createIcons();

    let currentStep = 1;
    let horarioEscolhido = "";
    let servicoEscolhido = null;
    let dadosBackend = { nomeBarbearia: "Barbearia", logoBarbearia: "", servicos: [], horariosBloqueadosPorData: {}, horariosPausaPadrao: [], whatsYukio: "", instagramYukio: "", telegramYukio: "", diasFechados: [] };

    function gerarHorarios15min() {
      const lista = [];
      for (let h = 8; h <= 21; h++) {
        for (let m = 0; m < 60; m += 15) {
          const horaStr = h < 10 ? `0${h}` : `${h}`;
          const minStr = m === 0 ? `00` : `${m}`;
          lista.push(`${horaStr}:${minStr}`);
        }
      }
      return lista;
    }

    const horariosLista = gerarHorarios15min();
    const inputData = document.getElementById('data-agendamento');
    const hojeStr = new Date().toISOString().split('T')[0];
    inputData.min = hojeStr;
    inputData.value = hojeStr;

    async function buscarDadosBackend() {
      try {
        const res = await fetch(`${API_URL}/api/dados`);
        dadosBackend = await res.json();
        
        const nomeBarbearia = dadosBackend.nomeBarbearia || "Barbearia";
        document.getElementById('barber-name').innerText = nomeBarbearia;
        document.getElementById('page-title').innerText = `${nomeBarbearia} - Agendamento Online`;

        if (dadosBackend.logoBarbearia) {
          const logoContainer = document.getElementById('logo-container');
          logoContainer.innerHTML = `<img src="${dadosBackend.logoBarbearia}" class="w-full h-full object-cover">`;
        }

        carregarServicosCliente();
      } catch (err) {
        console.error("Erro ao carregar dados:", err);
      }
    }

    function irParaPasso(passo) {
      if (passo === currentStep) return;
      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-3').classList.add('hidden');

      document.getElementById('step-1-indicator').className = 'text-zinc-500 font-normal flex items-center gap-1 hover:text-amber-400 transition-all';
      document.getElementById('step-2-indicator').className = 'text-zinc-500 font-normal flex items-center gap-1 hover:text-amber-400 transition-all';
      document.getElementById('step-3-indicator').className = 'text-zinc-500 font-normal flex items-center gap-1 hover:text-amber-400 transition-all';

      if (passo === 1) {
        document.getElementById('step-1').classList.remove('hidden');
        document.getElementById('step-1-indicator').className = 'text-amber-500 font-bold flex items-center gap-1 hover:text-amber-400 transition-all';
        document.getElementById('next-btn').innerHTML = '<span>Avançar para Horários</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
        currentStep = 1;
      } else if (passo === 2) {
        carregarHorariosCliente();
        document.getElementById('step-2').classList.remove('hidden');
        document.getElementById('step-2-indicator').className = 'text-amber-500 font-bold flex items-center gap-1 hover:text-amber-400 transition-all';
        document.getElementById('next-btn').innerHTML = '<span>Confirmar Dados</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
        currentStep = 2;
      } else if (passo === 3) {
        document.getElementById('step-3').classList.remove('hidden');
        document.getElementById('step-3-indicator').className = 'text-amber-500 font-bold flex items-center gap-1 hover:text-amber-400 transition-all';
        document.getElementById('next-btn').innerHTML = '<span>Finalizar Agendamento</span> <i data-lucide="check" class="w-4 h-4"></i>';
        currentStep = 3;
      }
      lucide.createIcons();
    }

    function carregarServicosCliente() {
      const servicos = dadosBackend.servicos && dadosBackend.servicos.length ? dadosBackend.servicos : [
        { id: 'corte', nome: 'Corte de Cabelo', preco: 3000, duracao: 50 },
        { id: 'combo', nome: 'Corte + Barba', preco: 4500, duracao: 80 }
      ];
      const container = document.getElementById('container-servicos-cliente');
      container.innerHTML = '';
      servicos.forEach((s, idx) => {
        if (idx === 0 && !servicoEscolhido) servicoEscolhido = s;
        const duracaoMin = s.duracao || 30;
        const label = document.createElement('label');
        label.className = (servicoEscolhido && servicoEscolhido.nome === s.nome)
          ? "card-servico flex items-center justify-between p-3.5 border-2 border-amber-500/80 rounded-2xl bg-amber-500/10 cursor-pointer transition-all"
          : "card-servico flex items-center justify-between p-3.5 border-2 border-zinc-800 rounded-2xl hover:border-zinc-700 cursor-pointer transition-all bg-zinc-950/40";
        label.onclick = () => selecionarServicoCard(label, s);
        label.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="radio" name="servico" value="${s.nome}" ${(servicoEscolhido && servicoEscolhido.nome === s.nome) ? 'checked' : ''} class="accent-amber-500 w-4 h-4">
            <div>
              <div class="font-bold text-sm text-zinc-100">${s.nome}</div>
              <div class="text-xs text-zinc-400">⏱️ Duração: ${duracaoMin} min</div>
            </div>
          </div>
          <span class="preco-tag font-bold text-sm ${(servicoEscolhido && servicoEscolhido.nome === s.nome) ? 'text-amber-500' : 'text-zinc-400'}">¥ ${Number(s.preco).toLocaleString()}</span>
        `;
        container.appendChild(label);
      });
    }

    function selecionarServicoCard(labelElement, servicoObj) {
      servicoEscolhido = servicoObj;
      document.querySelectorAll('.card-servico').forEach(card => {
        card.className = "card-servico flex items-center justify-between p-3.5 border-2 border-zinc-800 rounded-2xl hover:border-zinc-700 cursor-pointer transition-all bg-zinc-950/40";
        card.querySelector('.preco-tag').className = "preco-tag font-bold text-sm text-zinc-400";
        card.querySelector('input[type="radio"]').checked = false;
      });
      labelElement.className = "card-servico flex items-center justify-between p-3.5 border-2 border-amber-500/80 rounded-2xl bg-amber-500/10 cursor-pointer transition-all";
      labelElement.querySelector('.preco-tag').className = "preco-tag font-bold text-sm text-amber-500";
      labelElement.querySelector('input[type="radio"]').checked = true;
    }

    function horaParaMinutos(horaStr) {
      const [h, m] = horaStr.split(':').map(Number);
      return h * 60 + m;
    }

    async function carregarHorariosCliente() {
      const dataSel = inputData.value;
      if (!dataSel) return;
      const partes = dataSel.split('-');
      const dataObj = new Date(partes[0], partes[1] - 1, partes[2]);
      const diaDaSemana = dataObj.getDay();
      await buscarDadosBackend();
      const diasFechados = dadosBackend.diasFechados || [];

      if (diasFechados.includes(diaDaSemana)) {
        document.getElementById('alerta-dia-fechado').classList.remove('hidden');
        document.getElementById('wrapper-horarios').classList.add('hidden');
        document.getElementById('next-btn').disabled = true;
        document.getElementById('next-btn').classList.add('opacity-50', 'cursor-not-allowed');
        horarioEscolhido = "";
        return;
      } else {
        document.getElementById('alerta-dia-fechado').classList.add('hidden');
        document.getElementById('wrapper-horarios').classList.remove('hidden');
        document.getElementById('next-btn').disabled = false;
        document.getElementById('next-btn').classList.remove('opacity-50', 'cursor-not-allowed');
      }

      const duracaoServico = servicoEscolhido ? (servicoEscolhido.duracao || 30) : 30;
      const bloqueadosPorData = dadosBackend.horariosBloqueadosPorData || {};
      const bloqueadosDoDia = bloqueadosPorData[dataSel] || [];
      const pausasPadrao = dadosBackend.horariosPausaPadrao || [];

      const grid = document.getElementById('horarios-grid-cliente');
      grid.innerHTML = '';
      horarioEscolhido = "";
      let horariosDisponiveisCount = 0;

      horariosLista.forEach(horaInicio => {
        const inicioMin = horaParaMinutos(horaInicio);
        const fimMin = inicioMin + duracaoServico;

        // Verifica conflitos com bloqueios da data OU pausas recorrentes padrão
        let conflito = false;
        for (let m = inicioMin; m < fimMin; m += 15) {
          const hStr = String(Math.floor(m / 60)).padStart(2, '0');
          const mStr = String(m % 60).padStart(2, '0');
          const slotVerifica = `${hStr}:${mStr}`;
          if (bloqueadosDoDia.includes(slotVerifica) || pausasPadrao.includes(slotVerifica)) {
            conflito = true;
            break;
          }
        }

        if (conflito) return;

        horariosDisponiveisCount++;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.innerText = horaInicio;

        if (!horarioEscolhido) {
          horarioEscolhido = horaInicio;
          btn.className = "time-btn p-2 border-2 border-amber-500 bg-amber-500/20 text-amber-400 rounded-lg text-xs font-bold transition-all shadow-sm shadow-amber-500/10";
        } else {
          btn.className = "time-btn p-2 border border-zinc-800 bg-zinc-950/40 rounded-lg text-xs font-bold text-zinc-300 hover:border-zinc-700 transition-all";
        }
        btn.onclick = () => selecionarHorario(btn, horaInicio);
        grid.appendChild(btn);
      });

      if (horariosDisponiveisCount === 0) {
        grid.innerHTML = `<p class="text-xs text-amber-500 col-span-full text-center py-4">Não há horários disponíveis para este serviço nesta data.</p>`;
      }
    }

    function selecionarHorario(btn, hora) {
      horarioEscolhido = hora;
      document.querySelectorAll('.time-btn').forEach(b => {
        b.className = "time-btn p-2 border border-zinc-800 bg-zinc-950/40 rounded-lg text-xs font-bold text-zinc-300 hover:border-zinc-700 transition-all";
      });
      btn.className = "time-btn p-2 border-2 border-amber-500 bg-amber-500/20 text-amber-400 rounded-lg text-xs font-bold transition-all shadow-sm shadow-amber-500/10";
    }

    function formatarNumeroJapao(numero) {
      let limpo = (numero || '').replace(/\D/g, '');
      if (limpo.startsWith('0')) limpo = limpo.substring(1);
      if (!limpo.startsWith('81')) limpo = '81' + limpo;
      return limpo;
    }

    async function nextStep() {
      if (currentStep === 1) {
        irParaPasso(2);
      } else if (currentStep === 2) {
        if (!horarioEscolhido) { alert("Selecione um horário!"); return; }
        irParaPasso(3);
      } else if (currentStep === 3) {
        const nome = document.getElementById('nome-cliente').value;
        const whats = document.getElementById('whats-cliente').value || "Não informado";
        if (!nome) { alert("Por favor, preencha o seu nome!"); return; }

        const dataFormatada = inputData.value.split('-').reverse().join('/');
        const duracaoServico = servicoEscolhido.duracao || 30;

        const inicioMin = horaParaMinutos(horarioEscolhido);
        const horariosParaBloquear = [];
        for (let m = inicioMin; m < inicioMin + duracaoServico; m += 15) {
          const hStr = String(Math.floor(m / 60)).padStart(2, '0');
          const mStr = String(m % 60).padStart(2, '0');
          horariosParaBloquear.push(`${hStr}:${mStr}`);
        }

        try {
          for (let slot of horariosParaBloquear) {
            await fetch(`${API_URL}/api/agendar`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                cliente: nome,
                servico: servicoEscolhido.nome,
                preco: servicoEscolhido.preco,
                data: inputData.value,
                horario: slot,
                whatsapp: whats
              })
            });
          }
        } catch (e) {
          console.error("Erro ao agendar:", e);
        }

        const nomeLoja = dadosBackend.nomeBarbearia || "Barbearia";
        const textoMensagem = `✅ *SOLICITAÇÃO DE AGENDAMENTO!*\n\n` +
          `💈 *${nomeLoja} (Ota - Gunma)*\n` +
          `👤 *Cliente:* ${nome}\n` +
          `✂️ *Serviço:* ${servicoEscolhido.nome} (¥ ${Number(servicoEscolhido.preco).toLocaleString()} - ${duracaoServico} min)\n` +
          `📅 *Data:* ${dataFormatada}\n` +
          `⏰ *Horário:* ${horarioEscolhido}\n` +
          `📲 *Contato:* ${whats}\n\n` +
          `_Agendado via AgendaZap_`;

        const containerCanais = document.getElementById('container-botoes-canais');
        containerCanais.innerHTML = '';
        let temCanais = false;

        // WhatsApp
        if (dadosBackend.whatsYukio && dadosBackend.whatsYukio.trim() !== "") {
          temCanais = true;
          let numeroFinal = formatarNumeroJapao(dadosBackend.whatsYukio);
          let linkWhats = `https://api.whatsapp.com/send?phone=${numeroFinal}&text=${encodeURIComponent(textoMensagem)}`;
          
          let btnWhats = document.createElement('a');
          btnWhats.href = linkWhats;
          btnWhats.target = "_blank";
          btnWhats.className = "w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg";
          btnWhats.innerHTML = `<i data-lucide="message-circle" class="w-4 h-4"></i> Enviar via WhatsApp`;
          containerCanais.appendChild(btnWhats);
        }

        // Instagram
        if (dadosBackend.instagramYukio && dadosBackend.instagramYukio.trim() !== "") {
          temCanais = true;
          let userIg = dadosBackend.instagramYukio.replace('@', '').trim();
          let linkIg = `https://instagram.com/${userIg}`;

          let btnIg = document.createElement('button');
          btnIg.type = "button";
          btnIg.className = "w-full py-3.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-bold text-xs rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg";
          btnIg.innerHTML = `<i data-lucide="instagram" class="w-4 h-4"></i> Enviar via Instagram Direct`;
          
          btnIg.onclick = () => {
            navigator.clipboard.writeText(textoMensagem).then(() => {
              alert("📋 Dados do agendamento copiados!\n\nCole a mensagem no chat do Instagram para a barbearia.");
              window.open(linkIg, '_blank');
            }).catch(() => {
              window.open(linkIg, '_blank');
            });
          };
          containerCanais.appendChild(btnIg);
        }

        // Telegram
        if (dadosBackend.telegramYukio && dadosBackend.telegramYukio.trim() !== "") {
          temCanais = true;
          let userTg = dadosBackend.telegramYukio.replace('@', '').trim();
          let linkTg = `https://t.me/${userTg}?text=${encodeURIComponent(textoMensagem)}`;

          let btnTg = document.createElement('a');
          btnTg.href = linkTg;
          btnTg.target = "_blank";
          btnTg.className = "w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg";
          btnTg.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Enviar via Telegram`;
          containerCanais.appendChild(btnTg);
        }

        if (!temCanais) {
          document.getElementById('instrucao-envio').innerText = "Agendamento concluído com sucesso!";
        }

        document.getElementById('step-3').classList.add('hidden');
        document.getElementById('steps-indicator-wrapper').classList.add('hidden');
        document.getElementById('footer-actions').classList.add('hidden');
        document.getElementById('step-4').classList.remove('hidden');
      }
      lucide.createIcons();
    }

    buscarDadosBackend();
  </script>
</body>
</html>
