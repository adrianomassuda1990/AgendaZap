<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento - Barbearia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 sm:p-8 flex justify-center items-start">

  <div class="w-full max-w-lg space-y-6">
    
    <!-- CABEÇALHO COM LOGO E NOME -->
    <div class="text-center space-y-3 bg-zinc-900 p-6 rounded-2xl border border-zinc-800 shadow-xl">
      <div id="container-logo" class="w-20 h-20 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mx-auto border border-amber-500/20 overflow-hidden">
        <i data-lucide="scissors" class="w-8 h-8"></i>
      </div>
      <div>
        <h1 id="nome-barbearia-topo" class="text-xl font-bold text-zinc-100 uppercase tracking-tight">Barbearia</h1>
        <p class="text-xs text-zinc-400 mt-0.5">Selecione o serviço, data e horário</p>
      </div>
    </div>

    <!-- PASSO 1: SERVIÇOS -->
    <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 space-y-4">
      <h2 class="text-sm font-bold text-zinc-200 flex items-center gap-2 border-b border-zinc-800 pb-2">
        <span class="w-6 h-6 bg-amber-500 text-zinc-950 rounded-full flex items-center justify-center text-xs font-bold">1</span> Escolha o Serviço
      </h2>
      <div class="space-y-2" id="lista-servicos-cliente">
        <p class="text-xs text-zinc-500">A carregar serviços...</p>
      </div>
    </div>

    <!-- PASSO 2: DATA E HORÁRIO -->
    <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 space-y-4">
      <h2 class="text-sm font-bold text-zinc-200 flex items-center gap-2 border-b border-zinc-800 pb-2">
        <span class="w-6 h-6 bg-amber-500 text-zinc-950 rounded-full flex items-center justify-center text-xs font-bold">2</span> Data e Horário
      </h2>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Selecione a Data</label>
          <input type="date" id="data-agendamento" onchange="renderizarHorariosCliente()" class="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-amber-500 font-bold focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Horários Disponíveis</label>
          <div class="grid grid-cols-3 gap-2 p-3 bg-zinc-950 rounded-xl border border-zinc-800 max-h-56 overflow-y-auto" id="grid-horarios-cliente"></div>
        </div>
      </div>
    </div>

    <!-- PASSO 3: DADOS DO CLIENTE E CONFIRMAÇÃO -->
    <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 space-y-4">
      <h2 class="text-sm font-bold text-zinc-200 flex items-center gap-2 border-b border-zinc-800 pb-2">
        <span class="w-6 h-6 bg-amber-500 text-zinc-950 rounded-full flex items-center justify-center text-xs font-bold">3</span> Seus Dados
      </h2>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Seu Nome</label>
          <input type="text" id="cliente-nome" placeholder="Digite seu nome..." class="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Seu Telemóvel / WhatsApp</label>
          <input type="tel" id="cliente-whatsapp" placeholder="Ex: 09012345678" class="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:outline-none">
        </div>

        <div id="resumo-escolha" class="p-3 bg-zinc-950 rounded-xl border border-zinc-800 text-xs text-zinc-400 space-y-1">
          <p>Serviço: <span class="text-zinc-200 font-bold">Nenhum selecionado</span></p>
          <p>Horário: <span class="text-zinc-200 font-bold">Nenhum selecionado</span></p>
        </div>

        <button onclick="confirmarAgendamento()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold text-sm rounded-xl transition-all shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
          <i data-lucide="check-circle" class="w-4 h-4"></i> Confirmar Agendamento
        </button>
      </div>
    </div>

    <!-- LINK PARA O PAINEL -->
    <div class="text-center pb-6">
      <a href="painel.html" class="text-xs text-zinc-500 hover:text-amber-500 transition-all flex items-center justify-center gap-1">
        <i data-lucide="lock" class="w-3 h-3"></i> Acesso Restrito (Painel)
      </a>
    </div>

  </div>

  <script>
    const API_URL = "https://agendazap-ozrf.onrender.com";
    lucide.createIcons();

    let dadosServidor = {
      nomeBarbearia: "Barbearia",
      logoBarbearia: "",
      servicos: [],
      diasFechados: [],
      horariosBloqueadosPorData: {},
      horariosPausaPadrao: [],
      agendamentos: []
    };

    let servicoSelecionado = null;
    let horarioSelecionado = null;

    const inputDataCliente = document.getElementById('data-agendamento');
    const hojeStr = new Date().toISOString().split('T')[0];
    if (inputDataCliente) inputDataCliente.value = hojeStr;

    function gerarHorarios15min() {
      const lista = [];
      for (let h = 8; h <= 21; h++) {
        for (let m = 0; m < 60; m += 15) {
          const horaStr = h < 10 ? `0${h}` : `${h}`;
          const minStr = m === 0 ? `00` : `${m}`;
          lista.push(`${horaStr}:${minStr}`);
        }
      }
      return lista;
    }
    const horariosLista = gerarHorarios15min();

    async function carregarDadosCliente() {
      try {
        const res = await fetch(`${API_URL}/api/dados`);
        const data = await res.json();
        if (data) {
          dadosServidor = { ...dadosServidor, ...data };
          atualizarIdentidadeVisual();
          renderizarServicosCliente();
          renderizarHorariosCliente();
        }
      } catch (err) { console.error("Erro ao carregar dados:", err); }
    }

    function atualizarIdentidadeVisual() {
      if (dadosServidor.nomeBarbearia) {
        document.getElementById('nome-barbearia-topo').innerText = dadosServidor.nomeBarbearia;
      }
      if (dadosServidor.logoBarbearia) {
        const containerLogo = document.getElementById('container-logo');
        containerLogo.innerHTML = `<img src="${dadosServidor.logoBarbearia}" class="w-full h-full object-cover">`;
      }
    }

    function renderizarServicosCliente() {
      const container = document.getElementById('lista-servicos-cliente');
      container.innerHTML = '';
      const servicos = dadosServidor.servicos || [];

      if (servicos.length === 0) {
        container.innerHTML = `<p class="text-xs text-zinc-500">Nenhum serviço disponível no momento.</p>`;
        return;
      }

      servicos.forEach(s => {
        const div = document.createElement('div');
        const isSelected = servicoSelecionado && servicoSelecionado.id === s.id;
        div.className = isSelected 
          ? "p-3 bg-amber-500/10 border border-amber-500 text-amber-400 rounded-xl cursor-pointer flex justify-between items-center" 
          : "p-3 bg-zinc-950 border border-zinc-800 text-zinc-300 rounded-xl cursor-pointer flex justify-between items-center hover:border-zinc-700";
        
        div.innerHTML = `
          <div>
            <div class="text-sm font-bold text-zinc-100">${s.nome}</div>
            <div class="text-xs text-zinc-400">${s.duracao || 30} min</div>
          </div>
          <div class="text-sm font-bold text-amber-500">¥${s.preco}</div>
        `;
        div.onclick = () => {
          servicoSelecionado = s;
          renderizarServicosCliente();
          atualizarResumo();
        };
        container.appendChild(div);
      });
      lucide.createIcons();
    }

    function renderizarHorariosCliente() {
      const dataSel = inputDataCliente.value;
      const grid = document.getElementById('grid-horarios-cliente');
      grid.innerHTML = '';

      if (!dataSel) return;

      // Verificar se o dia da semana está fechado
      const dataObj = new Date(dataSel + 'T00:00:00');
      const diaSemana = dataObj.getDay();
      if ((dadosServidor.diasFechados || []).includes(diaSemana)) {
        grid.innerHTML = `<p class="text-xs text-red-400 col-span-3 text-center py-4 font-bold">Barbearia Fechada neste dia da semana.</p>`;
        return;
      }

      const bloqueadosDoDia = (dadosServidor.horariosBloqueadosPorData || {})[dataSel] || [];
      const pausasPadrao = dadosServidor.horariosPausaPadrao || [];

      horariosLista.forEach(hora => {
        const isBloqueado = bloqueadosDoDia.includes(hora) || pausasPadrao.includes(hora);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.innerText = hora;

        if (isBloqueado) {
          btn.className = "p-2.5 bg-zinc-900/50 border border-zinc-800/50 text-zinc-600 rounded-xl text-xs font-bold cursor-not-allowed line-through";
          btn.disabled = true;
        } else {
          const isSelected = horarioSelecionado === hora;
          btn.className = isSelected 
            ? "p-2.5 bg-amber-500 text-zinc-950 rounded-xl text-xs font-bold shadow-md" 
            : "p-2.5 bg-zinc-950 border border-zinc-800 text-zinc-300 rounded-xl text-xs font-bold hover:border-zinc-700";
          
          btn.onclick = () => {
            horarioSelecionado = hora;
            renderizarHorariosCliente();
            atualizarResumo();
          };
        }
        grid.appendChild(btn);
      });
    }

    function atualizarResumo() {
      const resumo = document.getElementById('resumo-escolha');
      resumo.innerHTML = `
        <p>Serviço: <span class="text-zinc-200 font-bold">${servicoSelecionado ? servicoSelecionado.nome + ' (¥' + servicoSelecionado.preco + ')' : 'Nenhum selecionado'}</span></p>
        <p>Horário: <span class="text-zinc-200 font-bold">${horarioSelecionado ? inputDataCliente.value + ' às ' + horarioSelecionado : 'Nenhum selecionado'}</span></p>
      `;
    }

    async function confirmarAgendamento() {
      if (!servicoSelecionado) { alert("Selecione um serviço!"); return; }
      if (!horarioSelecionado) { alert("Selecione um horário!"); return; }
      const nome = document.getElementById('cliente-nome').value.trim();
      const whatsapp = document.getElementById('cliente-whatsapp').value.trim();

      if (!nome || !whatsapp) { alert("Preencha o seu nome e telemóvel!"); return; }

      const dataSel = inputDataCliente.value;

      // Adiciona o bloqueio e o agendamento no servidor
      if (!dadosServidor.horariosBloqueadosPorData[dataSel]) {
        dadosServidor.horariosBloqueadosPorData[dataSel] = [];
      }
      dadosServidor.horariosBloqueadosPorData[dataSel].push(horarioSelecionado);

      if (!dadosServidor.agendamentos) dadosServidor.agendamentos = [];
      dadosServidor.agendamentos.push({
        cliente: nome,
        servico: servicoSelecionado.nome,
        preco: servicoSelecionado.preco,
        data: dataSel,
        horario: horarioSelecionado,
        whatsapp: whatsapp
      });

      try {
        const res = await fetch(`${API_URL}/api/configurar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dadosServidor)
        });

        if (res.ok) {
          alert("Agendamento realizado com sucesso!");
          
          // Redirecionar para o WhatsApp se houver número configurado
          const numeroZap = dadosServidor.whatsYukio || "";
          if (numeroZap) {
            const texto = encodeURIComponent(`Olá! Agendei ${servicoSelecionado.nome} para o dia ${dataSel} às ${horarioSelecionado}. Meu nome é ${nome}.`);
            window.location.href = `https://wa.me/${numeroZap}?text=${texto}`;
          } else {
            window.location.reload();
          }
        } else {
          alert("Erro ao efetuar agendamento no servidor.");
        }
      } catch (err) {
        alert("Erro de conexão.");
      }
    }

    carregarDadosCliente();
  </script>
</body>
</html>
